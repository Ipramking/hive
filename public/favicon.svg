<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" fill="none">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop stop-color="#141922"/>
      <stop offset="1" stop-color="#0a0c11"/>
    </linearGradient>
    <linearGradient id="edge" x1="120" y1="90" x2="392" y2="422" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5ce0ff"/>
      <stop offset="0.55" stop-color="#57a6ff"/>
      <stop offset="1" stop-color="#8a7bff"/>
    </linearGradient>
    <radialGradient id="core" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#c9f4ff"/>
      <stop offset="1" stop-color="#4fd2ff"/>
    </radialGradient>
  </defs>

  <!-- tile -->
  <rect width="512" height="512" rx="112" fill="url(#tile)"/>
  <rect x="6" y="6" width="500" height="500" rx="106" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="2"/>

  <!-- spokes: core to the three outer nodes -->
  <g stroke="url(#edge)" stroke-width="10" stroke-linecap="round" opacity="0.7">
    <line x1="256" y1="256" x2="256" y2="122"/>
    <line x1="256" y1="256" x2="372" y2="323"/>
    <line x1="256" y1="256" x2="140" y2="323"/>
  </g>

  <!-- hexagon ring (pointy-top) -->
  <path d="M256 106 L386 181 L386 331 L256 406 L126 331 L126 181 Z"
        fill="none" stroke="url(#edge)" stroke-width="26" stroke-linejoin="round"/>

  <!-- outer nodes -->
  <g fill="#dff6ff">
    <circle cx="256" cy="122" r="20"/>
    <circle cx="372" cy="323" r="20"/>
    <circle cx="140" cy="323" r="20"/>
  </g>

  <!-- core -->
  <circle cx="256" cy="256" r="34" fill="url(#core)"/>
  <circle cx="256" cy="256" r="34" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>
</svg>
